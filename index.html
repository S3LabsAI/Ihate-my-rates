<body>
  <div id="__bundler_placeholder">Loading Bundled Page...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

met>\n\n<div style=\"min-height:100vh;background:#F2EFE8\">\n\n<header style=\"position:sticky;top:0;z-index:20;background:#F2EFE8;border-bottom:3px solid #111\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:14px clamp(16px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n    <a href=\"#top\" style=\"display:flex;align-items:center\">\n      <img src=\"16bcec7d-3e87-4dc0-a498-582b4743ffb1\" alt=\"I Hate My Rates.com\" style=\"display:block;height:clamp(36px,4.5vw,50px);width:auto\">\n    <\u002Fa>\n    <nav style=\"display:flex;align-items:center;gap:clamp(14px,2.4vw,28px);flex-wrap:wrap;font:600 14px/1 Archivo\">\n      <a href=\"#value\">Price vs. value<\u002Fa>\n      <a href=\"#how\">How it works<\u002Fa>\n      <a href=\"#top\" style=\"background:#111;color:#F2EFE8;padding:12px 16px;font-weight:800;text-transform:uppercase;letter-spacing:.04em\" style-hover=\"background:#FF3B1F;color:#111\">Get my quote<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"top\" style=\"max-width:1320px;margin:0 auto;padding:clamp(32px,6vw,72px) clamp(16px,4vw,40px) clamp(40px,6vw,80px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(32px,5vw,64px);align-items:center\">\n  <div style=\"min-width:0\">\n    <div style=\"display:inline-flex;align-items:center;gap:8px;font:700 12px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;border:2px solid #111;padding:8px 10px;margin-bottom:24px\">\n      <span style=\"width:8px;height:8px;background:#FF3B1F;border-radius:50%;display:inline-block\"><\u002Fspan>\n      Auto · Home · Renters · Life · Business\n    <\u002Fdiv>\n    <h1 style=\"margin:0;font:900 clamp(64px,11vw,168px)/.84 Archivo;font-stretch:72%;text-transform:uppercase;letter-spacing:-.01em\">\n      <sc-if value=\"{{ headA }}\" hint-placeholder-val=\"{{ true }}\">\n        <span style=\"display:block\">I<\u002Fspan><span style=\"display:block;color:#FF3B1F\">Hate<\u002Fspan><span style=\"display:block\">My <span style=\"color:#FF3B1F\">Rates<\u002Fspan>.<\u002Fspan>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ headB }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block\">Ditch<\u002Fspan><span style=\"display:block\">Your<\u002Fspan><span style=\"display:block;color:#FF3B1F\">Carrier.<\u002Fspan>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ headC }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block\">Loyalty<\u002Fspan><span style=\"display:block\">Isn't<\u002Fspan><span style=\"display:block;color:#FF3B1F\">Cheap.<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fh1>\n    <p style=\"margin:28px 0 0;max-width:520px;font:500 clamp(18px,1.6vw,22px)/1.45 Archivo;text-wrap:pretty\">We don't just hunt for the lowest price. We find the policy that costs you the least when something actually goes wrong.<\u002Fp>\n    <div style=\"margin-top:28px;display:flex;gap:20px;flex-wrap:wrap;font:700 13px/1.3 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.04em\">\n      <span style=\"display:flex;align-items:center;gap:8px;flex:none;white-space:nowrap\"><span style=\"color:#FF3B1F\">✕<\u002Fspan>Free to compare<\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:8px;flex:none;white-space:nowrap\"><span style=\"color:#FF3B1F\">✕<\u002Fspan>No obligation<\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:8px;flex:none;white-space:nowrap\"><span style=\"color:#FF3B1F\">✕<\u002Fspan>Licensed agents<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"min-width:0;position:relative\">\n    <div style=\"position:absolute;inset:0;background:#111;transform:translate(12px,12px)\"><\u002Fdiv>\n    <div style=\"position:relative;background:#fff;border:3px solid #111;padding:clamp(22px,3vw,36px)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font:700 12px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em\">\n        <span>Free rate check<\u002Fspan>\n        <span style=\"color:#FF3B1F\">{{ stepLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"height:6px;background:#E6E1D6;margin-bottom:28px\"><div style=\"height:100%;background:#FF3B1F;width:{{ progress }};transition:width .3s\"><\u002Fdiv><\u002Fdiv>\n\n      <sc-if value=\"{{ s0 }}\" hint-placeholder-val=\"{{ true }}\">\n        <h2 style=\"margin:0 0 20px;font:900 clamp(32px,3.4vw,44px)/.95 Archivo;font-stretch:75%;text-transform:uppercase\">What are we fixing?<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px\">\n          <sc-for list=\"{{ types }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ t.pick }}\" style=\"text-align:left;background:#F2EFE8;border:2px solid #111;padding:16px;cursor:pointer;font:800 18px/1 Archivo;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;color:#111\" style-hover=\"background:#111;color:#F2EFE8\">{{ t.label }}<span style=\"font-size:16px\">→<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ s1 }}\" hint-placeholder-val=\"{{ false }}\">\n        <h2 style=\"margin:0 0 8px;font:900 clamp(32px,3.4vw,44px)/.95 Archivo;font-stretch:75%;text-transform:uppercase\">Where's home base?<\u002Fh2>\n        <p style=\"margin:0 0 20px;font:500 16px/1.4 Archivo;color:#444\">Rates and coverage options are set by ZIP.<\u002Fp>\n        <input value=\"{{ zip }}\" sc-camel-on-change=\"{{ onZip }}\" sc-camel-input-mode=\"numeric\" sc-camel-max-length=\"5\" placeholder=\"ZIP code\" style=\"width:100%;border:3px solid #111;background:#F2EFE8;padding:18px 16px;font:900 32px/1 Archivo;letter-spacing:.12em;color:#111\" style-focus=\"border-color:#FF3B1F\">\n        <div style=\"display:flex;gap:10px;margin-top:16px\">\n          <button sc-camel-on-click=\"{{ back }}\" style=\"border:2px solid #111;background:#fff;padding:16px 18px;font:800 15px/1 Archivo;text-transform:uppercase;cursor:pointer;color:#111\">←<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ next }}\" disabled=\"{{ zipBad }}\" style=\"flex:1;border:0;background:#111;color:#F2EFE8;padding:16px;font:900 18px/1 Archivo;text-transform:uppercase;letter-spacing:.04em;cursor:pointer\" style-hover=\"background:#FF3B1F;color:#111\">Continue →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ s2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <h2 style=\"margin:0 0 8px;font:900 clamp(32px,3.4vw,44px)/.95 Archivo;font-stretch:75%;text-transform:uppercase\">How bad is it?<\u002Fh2>\n        <p style=\"margin:0 0 20px;font:500 16px/1.4 Archivo;color:#444\">Roughly what you pay for {{ typeLower }} each month.<\u002Fp>\n        <div style=\"display:flex;align-items:baseline;gap:6px;font:900 64px/1 Archivo;font-stretch:75%\">$<span>{{ premium }}<\u002Fspan><span style=\"font:700 14px/1 'JetBrains Mono',monospace;color:#666\">/MO<\u002Fspan><\u002Fdiv>\n        <input type=\"range\" min=\"25\" max=\"800\" step=\"5\" value=\"{{ premium }}\" sc-camel-on-change=\"{{ onPremium }}\" style=\"width:100%;accent-color:#FF3B1F;margin:14px 0 6px\">\n        <div style=\"display:flex;justify-content:space-between;font:700 11px/1 'JetBrains Mono',monospace;color:#666\"><span>$25<\u002Fspan><span>$800+<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-top:22px\">\n          <button sc-camel-on-click=\"{{ back }}\" style=\"border:2px solid #111;background:#fff;padding:16px 18px;font:800 15px/1 Archivo;text-transform:uppercase;cursor:pointer;color:#111\">←<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ next }}\" style=\"flex:1;border:0;background:#111;color:#F2EFE8;padding:16px;font:900 18px/1 Archivo;text-transform:uppercase;letter-spacing:.04em;cursor:pointer\" style-hover=\"background:#FF3B1F;color:#111\">Continue →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ s3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <h2 style=\"margin:0 0 8px;font:900 clamp(32px,3.4vw,44px)/.95 Archivo;font-stretch:75%;text-transform:uppercase\">Where do we send it?<\u002Fh2>\n        <p style=\"margin:0 0 20px;font:500 16px/1.4 Archivo;color:#444\">An agent will reach out with your options. No spam, no pressure.<\u002Fp>\n        <div style=\"display:grid;gap:10px\">\n          <input value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Full name\" style=\"border:2px solid #111;background:#F2EFE8;padding:15px 14px;font:600 17px/1 Archivo;color:#111\" style-focus=\"border-color:#FF3B1F\">\n          <input value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" type=\"email\" placeholder=\"Email\" style=\"border:2px solid #111;background:#F2EFE8;padding:15px 14px;font:600 17px/1 Archivo;color:#111\" style-focus=\"border-color:#FF3B1F\">\n          <input value=\"{{ phone }}\" sc-camel-on-change=\"{{ onPhone }}\" type=\"tel\" placeholder=\"Phone\" style=\"border:2px solid #111;background:#F2EFE8;padding:15px 14px;font:600 17px/1 Archivo;color:#111\" style-focus=\"border-color:#FF3B1F\">\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-top:16px\">\n          <button sc-camel-on-click=\"{{ back }}\" style=\"border:2px solid #111;background:#fff;padding:16px 18px;font:800 15px/1 Archivo;text-transform:uppercase;cursor:pointer;color:#111\">←<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ next }}\" disabled=\"{{ contactBad }}\" style=\"flex:1;border:0;background:#FF3B1F;color:#111;padding:16px;font:900 18px/1 Archivo;text-transform:uppercase;letter-spacing:.04em;cursor:pointer\" style-hover=\"background:#111;color:#F2EFE8\">Get my rates →<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:14px 0 0;font:500 12px/1.45 Archivo;color:#666\">By submitting you agree to be contacted about insurance quotes by phone, text or email. Consent isn't a condition of purchase.<\u002Fp>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ s4 }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font:900 72px/1 Archivo;color:#FF3B1F\">✕<\u002Fdiv>\n        <h2 style=\"margin:8px 0 12px;font:900 clamp(36px,3.8vw,52px)/.92 Archivo;font-stretch:75%;text-transform:uppercase\">Done. Your carrier should be nervous.<\u002Fh2>\n        <p style=\"margin:0 0 22px;font:500 17px/1.45 Archivo;color:#333\">Thanks, {{ firstName }}. An agent is reviewing {{ typeLower }} options for {{ zip }}. Have your current policy handy so we can compare coverage line by line.<\u002Fp>\n        <button sc-camel-on-click=\"{{ restart }}\" style=\"border:2px solid #111;background:#fff;padding:14px 16px;font:800 14px/1 Archivo;text-transform:uppercase;cursor:pointer;color:#111\">Quote something else<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"value\" style=\"background:#111;color:#F2EFE8\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(16px,4vw,40px)\">\n    <div style=\"font:700 12px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.1em;color:#FF3B1F;margin-bottom:18px\">Price vs. value<\u002Fdiv>\n    <h2 style=\"margin:0 0 24px;font:900 clamp(48px,7vw,104px)/.86 Archivo;font-stretch:72%;text-transform:uppercase\">Cheap rate.<br><span style=\"color:#FF3B1F\">Expensive day.<\u002Fspan><\u002Fh2>\n    <p style=\"margin:0 0 clamp(36px,5vw,56px);max-width:620px;font:500 18px/1.5 Archivo;color:#D9D4CA;text-wrap:pretty\">A lower premium can cost you more if it drops the coverage you lean on. Repairs aren't cheap, and the fine print decides who pays for them.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px\">\n      <sc-for list=\"{{ scenTabs }}\" as=\"tb\" hint-placeholder-count=\"3\">\n        <sc-if value=\"{{ tb.on }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ tb.pick }}\" style=\"border:2px solid #FF3B1F;background:#FF3B1F;color:#111;padding:14px 20px;font:900 18px/1 Archivo;font-stretch:85%;text-transform:uppercase;cursor:pointer\">{{ tb.label }}<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ tb.off }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ tb.pick }}\" style=\"border:2px solid #3a3a3a;background:transparent;color:#F2EFE8;padding:14px 20px;font:900 18px/1 Archivo;font-stretch:85%;text-transform:uppercase;cursor:pointer\" style-hover=\"border-color:#F2EFE8\">{{ tb.label }}<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 clamp(32px,4vw,44px);max-width:720px;font:700 clamp(18px,1.8vw,22px)/1.4 Archivo;color:#F2EFE8;text-wrap:pretty\"><span style=\"color:#FF3B1F;font-family:'JetBrains Mono',monospace;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-right:10px\">The scenario<\u002Fspan>{{ scen.setup }}<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(20px,3vw,32px)\">\n      <div style=\"border:2px solid #3a3a3a;padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n          <span style=\"font:900 30px/1 Archivo;font-stretch:80%;text-transform:uppercase\">The cheap one<\u002Fspan>\n          <span style=\"font:900 40px/1 Archivo;font-stretch:75%\">{{ scen.cheapPrice }}<span style=\"font:700 13px/1 'JetBrains Mono',monospace;color:#8a857c\">/MO<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:0;border-top:1px solid #3a3a3a\">\n          <sc-for list=\"{{ cheapRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #3a3a3a;font:500 16px/1.3 Archivo\"><span style=\"color:#BDB8AE\">{{ r.k }}<\u002Fspan><span style=\"font-weight:700;text-align:right\">{{ r.v }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:700 12px/1 'JetBrains Mono',monospace;text-transform:uppercase;color:#8a857c;margin-bottom:8px\">You pay out of pocket<\u002Fdiv>\n          <div style=\"font:900 clamp(56px,6vw,80px)/.85 Archivo;font-stretch:72%;color:#FF3B1F\">{{ scen.cheapOOP }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:3px solid #FF3B1F;background:#F2EFE8;color:#111;padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;gap:20px;position:relative\">\n        <span style=\"position:absolute;top:-14px;left:20px;background:#FF3B1F;color:#111;padding:6px 10px;font:700 11px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em\">What we'd recommend<\u002Fspan>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n          <span style=\"font:900 30px/1 Archivo;font-stretch:80%;text-transform:uppercase\">The right one<\u002Fspan>\n          <span style=\"font:900 40px/1 Archivo;font-stretch:75%\">{{ scen.rightPrice }}<span style=\"font:700 13px/1 'JetBrains Mono',monospace;color:#666\">/MO<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;border-top:1px solid #CFC9BC\">\n          <sc-for list=\"{{ rightRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #CFC9BC;font:500 16px/1.3 Archivo\"><span style=\"color:#444\">{{ r.k }}<\u002Fspan><span style=\"font-weight:700;text-align:right\">{{ r.v }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:700 12px/1 'JetBrains Mono',monospace;text-transform:uppercase;color:#666;margin-bottom:8px\">You pay out of pocket<\u002Fdiv>\n          <div style=\"font:900 clamp(56px,6vw,80px)/.85 Archivo;font-stretch:72%\">{{ scen.rightOOP }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(28px,4vw,44px);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;border-top:2px solid #3a3a3a;padding-top:28px\">\n      <p style=\"margin:0;max-width:640px;font:600 clamp(18px,1.8vw,22px)/1.4 Archivo;text-wrap:pretty\">{{ scen.summary }}<\u002Fp>\n      <a href=\"#top\" style=\"background:#FF3B1F;color:#111;padding:18px 22px;font:900 17px/1 Archivo;text-transform:uppercase;letter-spacing:.04em\" style-hover=\"background:#F2EFE8;color:#111\">Find my right policy →<\u002Fa>\n    <\u002Fdiv>\n    <p style=\"margin:20px 0 0;font:500 12px/1.5 Archivo;color:#8a857c\">Illustrative examples. Actual premiums, deductibles, depreciation and coverage options vary by carrier, state, property and driver.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" style=\"border-top:3px solid #111\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(16px,4vw,40px)\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(32px,5vw,56px)\">\n      <h2 style=\"margin:0;font:900 clamp(48px,7vw,104px)/.86 Archivo;font-stretch:72%;text-transform:uppercase;max-width:820px\">How we<br>shop it.<\u002Fh2>\n      <p style=\"margin:0;max-width:380px;font:500 18px/1.45 Archivo;color:#333;text-wrap:pretty\">Carriers keep rates vague and coverage vaguer, betting you won't untangle either. We do. Five steps, comparing what you'd pay every month and on your worst day.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:3px solid #111\">\n      <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"5\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:clamp(12px,3vw,40px);padding:clamp(24px,3vw,36px) 0;border-bottom:3px solid #111;align-items:start\">\n          <div style=\"display:flex;align-items:flex-start;gap:18px\">\n            <span style=\"font:900 clamp(56px,6vw,88px)/.8 Archivo;font-stretch:72%;color:#FF3B1F\">{{ st.n }}<\u002Fspan>\n            <h3 style=\"margin:0;padding-top:.08em;font:900 clamp(26px,2.6vw,34px)/.95 Archivo;font-stretch:80%;text-transform:uppercase\">{{ st.title }}<\u002Fh3>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:500 17px/1.55 Archivo;color:#333;max-width:520px;text-wrap:pretty\">{{ st.body }}<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <sc-for list=\"{{ st.tags }}\" as=\"tg\" hint-placeholder-count=\"3\">\n              <span style=\"border:2px solid #111;padding:8px 10px;font:700 12px/1 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.03em\">{{ tg }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width:980px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(16px,4vw,40px)\">\n  <h2 style=\"margin:0 0 32px;font:900 clamp(44px,6vw,80px)/.88 Archivo;font-stretch:72%;text-transform:uppercase\">Fair questions.<\u002Fh2>\n  <div style=\"border-top:3px solid #111\">\n    <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"3\">\n      <div style=\"border-bottom:3px solid #111\">\n        <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:0;padding:24px 0;cursor:pointer;text-align:left;color:#111\">\n          <span style=\"flex:1;min-width:0;font:800 clamp(20px,2.2vw,26px)/1.15 Archivo\">{{ f.q }}<\u002Fspan>\n          <span style=\"font:900 28px/1 Archivo;color:#FF3B1F;flex:none\">{{ f.icon }}<\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0 0 24px;max-width:720px;font:500 17px/1.55 Archivo;color:#333;text-wrap:pretty\">{{ f.a }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#FF3B1F;border-top:3px solid #111\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(16px,4vw,40px);display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap\">\n    <h2 style=\"margin:0;font:900 clamp(56px,10vw,152px)/.84 Archivo;font-stretch:72%;text-transform:uppercase;color:#111\">Low price.<br>Real value.<br>Both.<\u002Fh2>\n    <a href=\"#top\" style=\"background:#111;color:#F2EFE8;padding:22px 28px;font:900 20px/1 Archivo;text-transform:uppercase;letter-spacing:.04em;border:3px solid #111\" style-hover=\"background:#F2EFE8;color:#111\">Get my quote →<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:#111;color:#BDB8AE\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:40px clamp(16px,4vw,40px);display:grid;gap:20px\">\n    <div style=\"display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center\">\n      <span style=\"display:flex;align-items:center;gap:12px\"><img src=\"dde55469-d9fb-4e8e-9bee-2b0b8114fc5f\" alt=\"\" aria-hidden=\"true\" style=\"display:block;height:30px;width:auto\"><span style=\"font:900 22px/1 Archivo;font-stretch:75%;text-transform:uppercase;color:#F2EFE8\"><span style=\"color:#FF3B1F\">I<\u002Fspan>Hate<span style=\"color:#FF3B1F\">My<\u002Fspan>Rates.com<\u002Fspan><\u002Fspan>\n      <div style=\"display:flex;gap:20px;flex-wrap:wrap;font:600 14px/1 Archivo\">\n        <a href=\"#\" style=\"color:#BDB8AE\" style-hover=\"color:#FF3B1F\">Privacy<\u002Fa>\n        <a href=\"#\" style=\"color:#BDB8AE\" style-hover=\"color:#FF3B1F\">Terms<\u002Fa>\n        <a href=\"#\" style=\"color:#BDB8AE\" style-hover=\"color:#FF3B1F\">Licensing<\u002Fa>\n        <a href=\"#\" style=\"color:#BDB8AE\" style-hover=\"color:#FF3B1F\">Contact<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;max-width:900px;font:500 12px/1.6 Archivo;color:#8a857c\">Savings and coverage vary by carrier, state, driving and claims history, and other underwriting factors. Not all carriers or products are available in all states. Quotes are not a guarantee of coverage. © 2026 I Hate My Rates.<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;headline&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;I Hate My Rates&quot;,&quot;Ditch Your Carrier&quot;,&quot;Loyalty Isn't Cheap&quot;],&quot;default&quot;:&quot;I Hate My Rates&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst SCEN = {\n  Auto: {\n    setup: 'A fender-bender puts your car in the shop for 12 days.',\n    cheapPrice: '$118', rightPrice: '$134',\n    cheapRows: [['Collision deductible', '$1,000'], ['Rental reimbursement', 'Not included'], ['Rental car, 12 days × $45', '$540']],\n    rightRows: [['Collision deductible', '$500'], ['Rental reimbursement', 'Up to $50/day'], ['Rental car, 12 days', 'Covered']],\n    cheapOOP: '$1,540', rightOOP: '$500',\n    summary: 'The \"expensive\" policy costs $192 more a year and saves $1,040 on one claim.'\n  },\n  Home: {\n    setup: 'Hail wrecks your 12-year-old roof. Replacing it runs $18,000.',\n    cheapPrice: '$142', rightPrice: '$171',\n    cheapRows: [['Wind/hail deductible', '2% of dwelling ($6,000)'], ['Roof paid at', 'Depreciated value ($9,000)'], ['Insurer pays', '$3,000']],\n    rightRows: [['Wind/hail deductible', '$1,000 flat'], ['Roof paid at', 'Full replacement cost'], ['Insurer pays', '$17,000']],\n    cheapOOP: '$15,000', rightOOP: '$1,000',\n    summary: 'The \"expensive\" policy costs $348 more a year and saves $14,000 on one storm.'\n  },\n  Bundle: {\n    setup: 'One storm damages your roof and your car. The car is in the shop for 10 days.',\n    cheapPrice: '$260', rightPrice: '$279',\n    cheapRows: [['Policies', 'Two carriers'], ['Deductibles', '$1,000 auto + $2,500 home'], ['Rental car, 10 days × $45', '$450']],\n    rightRows: [['Policies', 'One carrier, bundle discount'], ['Deductible', 'One $1,000 for the same event'], ['Rental car, 10 days', 'Covered']],\n    cheapOOP: '$3,950', rightOOP: '$1,000',\n    summary: 'The bundle costs $228 more a year and saves $2,950 on one storm. One claim, one adjuster.'\n  }\n};\nclass Component extends DCLogic {\n  state = { scen: 'Auto', step: 0, type: 'Auto', zip: '', premium: 180, name: '', email: '', phone: '', faq: 0 };\n  go = (d) => this.setState(s => ({ step: Math.max(0, Math.min(4, s.step + d)) }));\n  renderVals() {\n    const s = this.state, p = this.props;\n    const head = p.headline ?? 'I Hate My Rates';\n    const types = ['Auto', 'Home', 'Bundle', 'Renters', 'Life', 'Business'];\n    const faqs = [\n      ['Will you always find me a lower rate?', 'Not always. Sometimes the best move is a slightly higher premium with coverage that keeps you from paying out of pocket. If your current policy is already the right one, we will tell you.'],\n      ['Does it cost anything to compare?', 'No. Comparing is free, and you are never obligated to switch.'],\n      ['Can I switch mid-policy?', 'Usually, yes. Most carriers refund the unused portion of your premium. We line up the new policy first so there is no gap in coverage.']\n    ];\n    return {\n      headA: head === 'I Hate My Rates', headB: head === 'Ditch Your Carrier', headC: head === \"Loyalty Isn't Cheap\",\n      s0: s.step === 0, s1: s.step === 1, s2: s.step === 2, s3: s.step === 3, s4: s.step === 4,\n      stepLabel: s.step < 4 ? `Step ${s.step + 1} / 4` : 'Complete',\n      progress: `${(s.step / 4) * 100}%`,\n      types: types.map(t => ({ label: t, pick: () => this.setState({ type: t, step: 1 }) })),\n      typeLower: s.type.toLowerCase(),\n      zip: s.zip, zipBad: !/^\\d{5}$/.test(s.zip),\n      onZip: e => this.setState({ zip: e.target.value.replace(/\\D/g, '').slice(0, 5) }),\n      premium: s.premium, onPremium: e => this.setState({ premium: +e.target.value }),\n      name: s.name, email: s.email, phone: s.phone,\n      onName: e => this.setState({ name: e.target.value }),\n      onEmail: e => this.setState({ email: e.target.value }),\n      onPhone: e => this.setState({ phone: e.target.value }),\n      contactBad: !(s.name.trim() && /.+@.+\\..+/.test(s.email) && s.phone.replace(/\\D/g, '').length >= 10),\n      firstName: s.name.trim().split(' ')[0] || 'friend',\n      next: () => this.go(1), back: () => this.go(-1), restart: () => this.setState({ step: 0 }),\n      steps: [\n        { n: '01', title: 'Tell us what you have', body: 'What you insure, your ZIP, and what you pay now. Send your declarations page if you have it and we can see exactly what you are covered for.', tags: ['2 minutes', 'Dec page optional'] },\n        { n: '02', title: 'We read the fine print', body: 'Carriers bury what matters in jargon and endorsements. We map your limits, deductibles and add-ons, translate them into plain English, and flag the gaps you didn\\'t know you had.', tags: ['Deductibles', 'Liability limits', 'Rental reimbursement', 'Towing', 'Uninsured motorist'] },\n        { n: '03', title: 'Carriers compete', body: 'Multiple carriers quote the same coverage, so you compare apples to apples instead of a cheap quote with half the protection.', tags: ['Same coverage', 'Multiple carriers'] },\n        { n: '04', title: 'We price your worst day', body: 'Monthly premium is half the story. We show what each policy would cost you out of pocket after a claim, a tow, or a week without your car.', tags: ['Premium', 'Out-of-pocket', 'Claims experience'] },\n        { n: '05', title: 'You choose', body: 'Switch to the better value, or keep what you have. We handle the paperwork and make sure there is no gap in coverage.', tags: ['No obligation', 'No coverage gap'] }\n      ],\n      scenTabs: Object.keys(SCEN).map(k => ({ label: k, on: s.scen === k, off: s.scen !== k, pick: () => this.setState({ scen: k }) })),\n      scen: SCEN[s.scen],\n      cheapRows: SCEN[s.scen].cheapRows.map(([k, v]) => ({ k, v })),\n      rightRows: SCEN[s.scen].rightRows.map(([k, v]) => ({ k, v })),\n      faqs: faqs.map(([q, a], i) => ({ q, a, open: s.faq === i, icon: s.faq === i ? '−' : '+',\n        toggle: () => this.setState(st => ({ faq: st.faq === i ? -1 : i })) }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
